apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-api
  labels:
    helm.sh/chart: application-0.1.5
    app.kubernetes.io/name: application
    app.kubernetes.io/instance: ingresstest
    app.kubernetes.io/version: "0.1.5"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: "api.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: users-service
                port:
                  number: 8080
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-service
                port:
                  number: 9090
