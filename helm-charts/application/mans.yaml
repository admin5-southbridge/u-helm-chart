apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-dashboard
  labels:
    helm.sh/chart: application-0.1.5
    app.kubernetes.io/name: application
    app.kubernetes.io/instance: ingresstest
    app.kubernetes.io/version: "0.1.5"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/auth-secret: dashboard-auth
    nginx.ingress.kubernetes.io/auth-type: basic
spec:
  ingressClassName: nginx-internal
  tls:
    - hosts:
        - "dashboard.internal.local"
      secretName: dashboard-tls
  rules:
    - host: "dashboard.internal.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-service
                port:
                  number: 3000
