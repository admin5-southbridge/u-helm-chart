apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingresstest-application
  labels:
    helm.sh/chart: application-0.1.5
    app.kubernetes.io/name: application
    app.kubernetes.io/instance: ingresstest
    app.kubernetes.io/version: "0.1.5"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application
      app.kubernetes.io/instance: ingresstest
  template:
    metadata:
      labels:
        helm.sh/chart: application-0.1.5
        app.kubernetes.io/name: application
        app.kubernetes.io/instance: ingresstest
        app.kubernetes.io/version: "0.1.5"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: ingresstest-application
      securityContext:
        {}
      containers:
        - name: application
          securityContext:
            {}
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
